<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JobMatch Copilot</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 320px;
        margin: 0;
        padding: 12px;
        font-size: 13px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      label {
        display: block;
        margin-bottom: 8px;
      }
      label span {
        display: block;
        margin-bottom: 2px;
        color: #444;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 4px 6px;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      button {
        cursor: pointer;
      }
      #status {
        margin-top: 12px;
        padding-top: 8px;
        border-top: 1px solid #ddd;
        color: #444;
      }
      #status.error {
        color: #b00020;
      }
    </style>
  </head>
  <body>
    <h1>JobMatch Copilot</h1>
    <form id="settings-form">
      <label>
        <span>Web App URL</span>
        <input
          id="apiBaseUrl"
          type="text"
          placeholder="http://localhost:3000"
        />
      </label>
      <label>
        <span>Personal access token</span>
        <input id="pat" type="password" autocomplete="off" />
      </label>
      <label>
        <span>Active search criteria</span>
        <select id="activeCriteriaId">
          <option value="">— none synced yet —</option>
        </select>
      </label>
      <label>
        <span>LLM provider</span>
        <select id="llmProvider">
          <option value="claude">Claude</option>
          <option value="openai">OpenAI</option>
          <option value="free">Free (open-weight, Groq)</option>
        </select>
      </label>
      <label>
        <span>LLM API key</span>
        <input id="llmApiKey" type="password" autocomplete="off" />
      </label>
      <div class="actions">
        <button type="submit">Save</button>
        <button type="button" id="sync-now">Sync now</button>
      </div>
    </form>
    <div id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
